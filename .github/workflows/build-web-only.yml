on:
  push:
    branches:
      - main
  pull_request:

env:
  BUILDKIT_PROGRESS: plain
  DISCOURSE_TAG: "v2026.8.0"
  DOCKER_IMAGE: docker.io/garagelabdus/discourse

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: checkout tests passed
        uses: actions/checkout@v6
        with:
          repository: discourse/discourse
          ref: ${{ env.DISCOURSE_TAG }}
          fetch-depth: 1
      - id: version
        run: |
          version=$(ruby -r ./lib/version.rb -e "puts ::Discourse::VERSION::STRING")
          echo "version=$version"
          echo "version=$version" >> $GITHUB_OUTPUT

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: download-launcher
        run: |
          BINDIR="bin"
          package="${BINDIR}/launcher.tar.gz"
          curl -s -o ${package} -L https://get.discourse.org/launcher/latest/launcher-linux-${{ env.ARCH }}.tar.gz
          tar -zxf ${package} -C ${BINDIR}
          rm ${package}
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: build from configuration
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          bin/launcher build \
            --set params.version=${{ env.DISCOURSE_TAG }} \
            web_only \
            --tag ${{ env.DOCKER_IMAGE }} \
            --output=type=docker
          docker images
      - name: build and push
        if: ${{ github.event_name == 'push' }}
        run: |
          bin/launcher build \
            --set params.version=${{ env.DISCOURSE_TAG }} \
            web_only \
            --tag ${{ env.DOCKER_IMAGE }} \
            --output=type=registry,push-by-digest=true \
            --metadata-file=/tmp/out.json
      - name: save image digests
        if: ${{ github.event_name == 'push' }}
        id: metadata
        run: |
          latest_${{ env.ARCH }}=$(jq -r '."containerimage.digest"' /tmp/out.json)
          echo "latest_${{ env.ARCH }}=$latest_${{ env.ARCH }}"
          echo "latest_${{ env.ARCH }}=$latest_${{ env.ARCH }}" >> $GITHUB_OUTPUT
    outputs:
      latest_amd64: ${{ steps.metadata.outputs.latest_amd64 }}
      latest_arm64: ${{ steps.metadata.outputs.latest_arm64 }}

  manifest:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: update manifest
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:latest \
            ${{ needs.build.outputs.latest_amd64 }} \
            ${{ needs.build.outputs.latest_arm64 }}

          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:${{ needs.version.outputs.version }} \
            ${{ needs.build.outputs.latest_amd64 }} \
            ${{ needs.build.outputs.latest_arm64 }}
