on:
  push:
    branches:
      - main
  pull_request:

env:
  BUILDKIT_PROGRESS: plain
  DISCOURSE_VERSION: "v2026.8.0"
  DOCKER_IMAGE: docker.io/garagelabdus/discourse

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: download-launcher
        run: |
          BINDIR="bin"
          package="${BINDIR}/launcher.tar.gz"
          curl -s -o ${package} -L https://get.discourse.org/launcher/latest/launcher-linux-${{ env.ARCH }}.tar.gz
          tar -zxf ${package} -C ${BINDIR}
          rm ${package}
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: build from configuration
        run: |
          bin/launcher build \
            --set params.version=${{ env.DISCOURSE_VERSION }} \
            web_only \
            --tag ${{ env.DOCKER_IMAGE }} \
            --output=type=docker
          docker images
