params:
  reqs_per_second: 12
  burst_per_second: 12
  reqs_per_minute: 200
  burst_per_minute: 100
  conn_per_ip: 20
  scim_rate: 20
  scim_burst: 300
  scim_delay: 20
  scim_conn_per_ip: 50

run:
  - file:
     path: "/etc/nginx/conf.d/outlets/before-server/30-ratelimited.conf"
     contents: |
       limit_req_zone $binary_remote_addr zone=flood:10m rate=$reqs_per_secondr/s;
       limit_req_zone $binary_remote_addr zone=bot:10m rate=$reqs_per_minuter/m;
       limit_req_zone $binary_remote_addr zone=scim:10m rate=$scim_rater/s;
       limit_req_status 429;
       limit_conn_zone $binary_remote_addr zone=connperip:10m;
       limit_conn_status 429;

  - file:
     path: "/etc/nginx/conf.d/outlets/discourse/30-ratelimited.conf"
     contents: |
         limit_conn connperip $conn_per_ip;
         limit_req zone=flood burst=$burst_per_second nodelay;
         limit_req zone=bot burst=$burst_per_minute nodelay;

  - file:
     path: "/etc/nginx/conf.d/outlets/server/10-scim.conf"
     contents: |
       location ~ ^/scim/v2(/.*)?$ {
         limit_conn connperip $scim_conn_per_ip;
         limit_req zone=scim burst=$scim_burst delay=$scim_delay;

         proxy_set_header Host $http_host;
         proxy_set_header X-Request-Start "t=${msec}";
         proxy_set_header X-Forwarded-For $remote_addr;
         proxy_set_header X-Forwarded-Proto $thescheme;
         proxy_set_header X-Sendfile-Type "";
         proxy_set_header X-Accel-Mapping "";
         proxy_set_header Client-Ip "";
         proxy_pass http://discourse;
       }
